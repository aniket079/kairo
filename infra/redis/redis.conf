# Redis Configuration for Kairo Development Environment

# Network and General
port 6379
bind 0.0.0.0
databases 16
timeout 0
tcp-keepalive 300

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""

# AOF (Append Only File)
appendonly no
appendfsync everysec

# Client Management
maxclients 10000

# Performance
hz 10
dynamic-hz yes

# Lua scripting
lua-time-limit 5000

# Cluster (disabled for development)
# cluster-enabled no

# Replication (disabled for development)
# replicaof 
